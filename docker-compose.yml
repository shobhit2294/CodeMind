services:
  codemind:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      CODEMIND_DATA: /data
      SANDBOX_IMAGE: codemind-sandbox:local
    volumes:
      - codemind_data:/data
      # Trusted orchestrator only; repository containers never receive this socket.
      - /var/run/docker.sock:/var/run/docker.sock
  sandbox-image:
    build: ./sandbox
    image: codemind-sandbox:local
    profiles: ["build-sandbox"]
volumes:
  codemind_data:
